<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD BOX TV - Live Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/videojs-video-element/+esm" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/player.style/yt/+esm" type="module"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f0f0f0; font-family: sans-serif; text-align: center; padding-bottom: 50px; }
        
        .header {
            background: linear-gradient(90deg, #FF0000 0%, #FF8C00 100%);
            color: #fff; padding: 20px; margin-bottom: 20px; text-transform: uppercase;
            letter-spacing: 2px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-bottom: 3px solid #fff;
        }

        .main-wrapper { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .player-container { width: 100%; border-radius: 8px; overflow: hidden; position: relative; background: #000; }
        media-theme-yt { width: 100%; --media-theme-yt-primary: #ff0000; }
        .watermark { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.85); font-family: 'Playfair Display', serif; font-size: 12px; font-style: italic; z-index: 100; pointer-events: none; }

        .btn-player { background: #ff8c00; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; cursor: pointer; margin: 15px 0; width: 100%; font-weight: bold; text-transform: uppercase; }
        
        /* --- নতুন উন্নত অ্যাড বক্স স্টাইল --- */
        .my-own-ad { 
            display: block; 
            margin: 20px 0; 
            border: 1px solid #ddd; 
            padding: 10px; 
            border-radius: 8px; 
            background: #fafafa;
            text-decoration: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .my-own-ad img { 
            width: 100%; 
            height: auto; 
            display: block; 
            border-radius: 6px;
            margin-bottom: 12px;
        }
        
        /* হোয়াটসঅ্যাপ বাটন স্টাইল */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 30px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
            animation: pulse 2s infinite;
        }
        .whatsapp-btn:hover {
            background-color: #1ebd58;
            transform: scale(1.02);
        }

        /* বাটনের আকর্ষণ বাড়ানোর জন্য পালস অ্যানিমেশন */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        .counter-box { border: 1px solid #999; padding: 10px; width: 200px; margin: 20px auto; font-size: 13px; background: #fff; text-align: center; }
        .counter-line { border-bottom: 1px solid #eee; padding: 4px 0; }
        .counter-num { font-weight: bold; display: block; font-size: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>BD BOX TV - Live Player</h2>
    </div>

    <div class="main-wrapper">
        <div class="player-container">
            <div class="watermark">BD BOX TV</div>
            <media-theme-yt>
                <videojs-video 
                    crossorigin="anonymous" playsinline slot="media" 
                    src="https://bd-mc-fblive.fancode.com/mumbai/142700_english_hls_f44fd5b5e796934_1ta-di_h264/480p.m3u8"
                    poster="https://res.cloudinary.com/dlklqihg6/image/upload/v1758819334/tglzsdq34uitwxd8xlg6.png">
                </videojs-video>
            </media-theme-yt>
        </div>

        <button class="btn-player">Player 2 / Visit Link</button>

        <!-- অ্যাড বক্স সেকশন -->
        <a href="https://wa.me/+8801531151169" class="my-own-ad" target="_blank">
            <img src="https://res.cloudinary.com/dlklqihg6/image/upload/v1779876392/uctp205duwn37jjuvfuy.jpg" alt="Product Banner">
            <div class="whatsapp-btn">
                💬 Order on WhatsApp
            </div>
        </a>

        <div class="counter-box">
            <div class="counter-line">Now Online: <span class="counter-num">--</span></div>
            <div class="counter-line">Total Visitors:<br><span class="counter-num">3589</span></div>
        </div>
    </div>

    <script>
        // Link Configuration -----------------------------
        const player2VideoLink = ""; 
        const otherWebsiteLink = "https://t.me/+JSvX2Vz-ACA1ZTdl"; 
        // ---------------------------------------------------

        document.querySelector('.btn-player').addEventListener('click', function() {
            const videoElement = document.querySelector('videojs-video');

            if (player2VideoLink !== "") {
                // Change video source locally
                videoElement.setAttribute('src', player2VideoLink);
                alert('Backup Player is loading...');
            } 
            else if (otherWebsiteLink !== "") {
                // Redirect to website
                window.location.href = otherWebsiteLink;
            } 
            else {
                alert('Sorry, no link is configured!');
            }
        });

        function adjustPlayerHeight() {
            const player = document.querySelector('media-theme-yt');
            if(player) {
                const width = player.clientWidth;
                player.style.height = (width * (9/16)) + "px";
            }
        }
        window.addEventListener('load', adjustPlayerHeight);
        window.addEventListener('resize', adjustPlayerHeight);
    </script>
</body>
</html>
